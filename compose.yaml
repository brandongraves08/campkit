services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # Loopback only; the app talks to the database over the compose network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: campkit:local
    restart: unless-stopped
    # The only source of secrets. ``.env`` is git-ignored; the image never
    # contains a credential and this file only references variable names.
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CAMPKIT_DATA_DIR: /data
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?set ALLOWED_HOSTS in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Private binding: only the host's loopback reaches the app. The
      # home-network/VPN reverse proxy is the ingress (see deploy/README.md).
      - "127.0.0.1:${CAMPKIT_HTTP_PORT:-8000}:8000"
    volumes:
      # Durable application data: private intake photos live under /data/private.
      - campkit_data:/data
      # Collected static files, served by the reverse proxy from this volume.
      - campkit_static:/app/staticfiles
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.socket(); s.settimeout(4); sys.exit(0 if s.connect_ex(('127.0.0.1', 8000)) == 0 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    command:
      - sh
      - -c
      - |
        set -e
        python manage.py migrate --noinput
        python manage.py collectstatic --noinput
        exec gunicorn --bind 0.0.0.0:8000 --workers 3 --access-logfile - --error-logfile - config.wsgi:application

volumes:
  postgres_data:
  campkit_data:
  campkit_static:
