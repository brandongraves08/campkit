{% extends "base.html" %}

{% block title %}Join CampKit{% endblock %}

{% block content %}
  <div class="card auth-card">
    <h1>Join your CampKit household</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="button-row">
        <button class="button button-primary" type="submit">Create account</button>
      </div>
    </form>
  </div>
{% endblock %}
