{% extends "base.html" %}

{% block title %}Choose a space · CampKit{% endblock %}

{% block content %}
  <section class="card auth-card">
    <h1>Choose a space</h1>
    <p class="fine">Your account has access to more than one private space. Choose which one to open.</p>
    <form method="post" action="{% url 'select_household' %}">
      {% csrf_token %}
      <label for="household-choice">Space</label>
      <select id="household-choice" name="household_id" required>
        {% for membership in memberships %}
          <option value="{{ membership.household_id }}">{{ membership.household.name }} · {{ membership.get_role_display }}</option>
        {% endfor %}
      </select>
      <input type="hidden" name="next" value="{{ next_url }}">
      <div class="button-row">
        <button class="button button-primary" type="submit">Continue</button>
      </div>
    </form>
  </section>
{% endblock %}
