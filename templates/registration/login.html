{% extends "base.html" %}

{% block title %}Sign in · CampKit{% endblock %}

{% block content %}
  <div class="card auth-card">
    <h1>Sign in to CampKit</h1>
    {% if form.errors %}<p role="alert">Your username or password was not accepted.</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="field">
        <label for="id_username">Email</label>
        <input id="id_username" name="username" type="text" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="id_password">Password</label>
        <input id="id_password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <div class="button-row">
        <button class="button button-primary" type="submit">Sign in</button>
      </div>
    </form>
    <p class="fine">New to CampKit? <a href="{% url 'signup' %}">Create an account</a> to start a private space.</p>
  </div>
{% endblock %}
