{% extends "base.html" %}

{% block title %}{{ title }} · CampKit{% endblock %}

{% block content %}
  <p><a href="{% url 'inventory:pantry_list' %}">← Back to pantry</a></p>
  <div class="page-head">
    <h1>{{ title }}</h1>
    <p class="lede">New pantry facts start as estimated until a household member confirms them.</p>
  </div>
  <div class="card auth-card">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="button-row">
        <button class="button button-primary" type="submit">Save</button>
        <a class="button" href="{% url 'inventory:pantry_list' %}">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
