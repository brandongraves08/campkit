name: tests

# The mechanical half of the rule→test contract in AGENTS.md: nothing merges to
# main with a red suite. Runs only when Actions is enabled for this repository.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run the suite
        run: python -m pytest -q
